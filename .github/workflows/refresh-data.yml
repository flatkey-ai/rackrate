name: Refresh public GPU pricing data

on:
  schedule:
    # GitHub uses UTC: 02:30 UTC is 10:30 Asia/Shanghai, every day.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pricing-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'flatkey-ai/rackrate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - name: Install the pinned public collection library
        run: |
          python -m pip install -r requirements-collector.txt
          python -m playwright install --with-deps chromium
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Collect all anonymous public GPU prices
        run: bun run data:refresh
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - name: Commit verified dataset
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/offers.json data/price-history.json data/public-prices.json data/fx-rates.json; then
            echo "No pricing changes"
            exit 0
          fi
          git config user.name "rackrate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/price-history.json data/public-prices.json data/fx-rates.json
          git commit -m "data: refresh official GPU prices [skip ci]"
          git push
      - name: Preserve the verified collection result
        uses: actions/upload-artifact@v4
        with:
          name: public-gpu-prices-${{ github.run_id }}
          path: |
            data/offers.json
            data/public-prices.json
            data/fx-rates.json
          retention-days: 7
