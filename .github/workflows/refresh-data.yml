name: Refresh GPU pricing data

on:
  schedule:
    # GitHub uses UTC: 02:30 UTC is 10:30 Asia/Shanghai, every day.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Collect again even if today's verified snapshot already exists
        type: boolean
        required: false
        default: false

permissions:
  contents: write


concurrency:
  group: refresh-pricing-data
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'flatkey-ai/rackrate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      # GitHub permissions cover the whole job. Only the authorized + oidc
      # helper requests an identity; public/token mode never requests one.
      id-token: write
    env:
      # Missing variable preserves the credential-free public collection mode.
      RACKRATE_COLLECTION_MODE: ${{ vars.RACKRATE_COLLECTION_MODE || 'public' }}
      RACKRATE_NEBIUS_AUTH_MODE: ${{ vars.RACKRATE_NEBIUS_AUTH_MODE || 'token' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restrict authorized collection to the production branch
        if: env.RACKRATE_COLLECTION_MODE == 'authorized'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Authorized collection is restricted to main. Use public mode for branch checks."
            exit 1
          fi
      - name: Avoid a duplicate successful daily collection
        id: due
        env:
          GPU_PRICE_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh || false }}
        run: node scripts/daily-refresh.mjs
      - uses: actions/setup-python@v5
        if: steps.due.outputs.collect == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-collector.txt
      - name: Install the pinned collection library
        if: steps.due.outputs.collect == 'true'
        run: |
          python -m pip install -r requirements-collector.txt
          python -m playwright install --with-deps chromium
      - uses: oven-sh/setup-bun@v2
        if: steps.due.outputs.collect == 'true'
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        if: steps.due.outputs.collect == 'true'
      - name: Collect the nine tracked providers' public GPU prices
        if: steps.due.outputs.collect == 'true' && env.RACKRATE_COLLECTION_MODE == 'public'
        run: bun run data:refresh
      - name: Collect public and authorized visible GPU prices
        if: steps.due.outputs.collect == 'true' && env.RACKRATE_COLLECTION_MODE == 'authorized'
        env:
          RACKRATE_LAMBDA_STORAGE_STATE_JSON: ${{ secrets.RACKRATE_LAMBDA_STORAGE_STATE_JSON }}
          RACKRATE_AUTODL_STORAGE_STATE_JSON: ${{ secrets.RACKRATE_AUTODL_STORAGE_STATE_JSON }}
          RACKRATE_UCLOUD_CONSOLE_SESSION_JSON: ${{ secrets.RACKRATE_UCLOUD_CONSOLE_SESSION_JSON }}
          RACKRATE_NEBIUS_ACCESS_TOKEN: ${{ secrets.RACKRATE_NEBIUS_ACCESS_TOKEN }}
          RACKRATE_NEBIUS_SERVICE_ACCOUNT_ID: ${{ vars.RACKRATE_NEBIUS_SERVICE_ACCOUNT_ID }}
          RACKRATE_NEBIUS_OIDC_AUDIENCE: ${{ vars.RACKRATE_NEBIUS_OIDC_AUDIENCE }}
        run: bun run data:refresh
      - name: Test credential handling without real sessions
        if: steps.due.outputs.collect == 'true'
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - run: bun run test
        if: steps.due.outputs.collect == 'true'
      - run: bun run typecheck
        if: steps.due.outputs.collect == 'true'
      - run: bun run build
        id: validation_build
        if: steps.due.outputs.collect == 'true'
      - name: Commit verified dataset
        if: github.ref == 'refs/heads/main' && steps.due.outputs.collect == 'true'
        run: |
          if git diff --quiet -- data/offers.json data/price-history.json data/price-history/ data/public-prices.json data/fx-rates.json; then
            echo "No pricing changes"
            exit 0
          fi
          git config user.name "rackrate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/price-history.json data/price-history/ data/public-prices.json data/fx-rates.json
          git commit -m "data: refresh official GPU prices [skip ci]"
          git push
      - name: Warm and verify the cloud-published snapshot
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-deployment.mjs
      - name: Preserve the verified collection result
        if: always() && steps.due.outputs.collect == 'true' && steps.validation_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: public-gpu-prices-${{ github.run_id }}
          path: |
            data/offers.json
            data/public-prices.json
            data/fx-rates.json
            data/price-history.json
            data/price-history/
          retention-days: 7
