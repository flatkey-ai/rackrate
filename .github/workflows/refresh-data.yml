name: Refresh public GPU pricing data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-pricing-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run data:refresh
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - name: Commit verified dataset
        run: |
          if git diff --quiet -- data/offers.json data/price-history.json; then
            echo "No pricing changes"
            exit 0
          fi
          git config user.name "rackrate-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/price-history.json
          git commit -m "data: refresh official GPU prices [skip ci]"
          git push
