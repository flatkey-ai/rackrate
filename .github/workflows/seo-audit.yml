name: Audit production SEO

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-seo-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.repository == 'flatkey-ai/rackrate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun run seo:audit -- https://rackrate.org

